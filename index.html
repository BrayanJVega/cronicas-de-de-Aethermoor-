<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crónicas de Aethermoor — RPG de Aventuras</title>
  <meta name="description" content="Embárcate en un RPG de fantasía y aventuras en navegador. Explora mapas, lucha en combates por turnos, compra equipo, completa misiones y derrota al Señor Oscuro Malachar.">
  
  <!-- Modern Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Combined styles aggregator -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="theme-dark">
  
  <!-- Floating background particles canvas overlay -->
  <div class="particles-bg"></div>

  <!-- Primary Application view mount point -->
  <div id="app" class="app-container">
    <!-- UI screens will be injected here dynamically -->
    <div style="display:flex; justify-content:center; align-items:center; height:100vh">
      <div class="text-gold font-mono" style="animation: pulse 1.5s infinite">Cargando motor de juego...</div>
    </div>
  </div>

  <!-- Main scripts launcher -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
